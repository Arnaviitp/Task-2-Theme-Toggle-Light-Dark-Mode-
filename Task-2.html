<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Toggle with Unique Features</title>
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #f0f0f0, #dcdcdc);
        --card-bg: rgba(255, 255, 255, 0.6);
        --text-color: #333;
        --btn-bg: #333;
        --btn-color: #fff;
      }

      [data-theme="dark"] {
        --bg-gradient: linear-gradient(135deg, #1a1a2e, #16213e);
        --card-bg: rgba(25, 25, 25, 0.6);
        --text-color: #f0f0f0;
        --btn-bg: #f0f0f0;
        --btn-color: #333;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: var(--text-color);
        background: var(--bg-gradient);
        background-attachment: fixed;
        transition: background 1s ease, color 0.5s ease;
      }

      /* Parallax effect */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        background-size: 200% 200%;
        z-index: -1;
        transform: translateY(0);
        transition: transform 0.3s ease;
      }

      .theme-toggle {
        margin: 20px;
        padding: 10px 20px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--btn-color);
        font-size: 1.5rem;
        transition: all 0.4s ease;
      }

      .theme-toggle:hover {
        transform: rotate(15deg) scale(1.1);
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        width: 90%;
        max-width: 1000px;
        margin-bottom: 40px;
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: translateY(30px);
        animation: fadeUp 0.8s forwards;
        transition: all 0.4s ease;
      }

      .card:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle">🌞</button>

    <div class="cards">
      <div class="card">
        <h2>Card 1</h2>
        <p>This is a responsive glassmorphism card with glow hover effect.</p>
      </div>
      <div class="card">
        <h2>Card 2</h2>
        <p>Theme toggle remembers your choice using localStorage.</p>
      </div>
      <div class="card">
        <h2>Card 3</h2>
        <p>Background shifts with gradients + parallax scroll.</p>
      </div>
    </div>

    <script>
      const toggleBtn = document.getElementById("themeToggle");
      const body = document.body;

      // Load theme from localStorage
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) {
        body.setAttribute("data-theme", savedTheme);
        toggleBtn.textContent = savedTheme === "dark" ? "🌙" : "🌞";
      }

      toggleBtn.addEventListener("click", () => {
        const currentTheme = body.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        body.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        toggleBtn.textContent = newTheme === "dark" ? "🌙" : "🌞";
      });

      // Parallax effect
      window.addEventListener("scroll", () => {
        const scrollY = window.scrollY;
        document.body.style.setProperty(
          "--scroll-offset",
          `${scrollY * 0.2}px`
        );
        document.body.beforeTransform = `translateY(${scrollY * 0.2}px)`;
        document.body.style.transform = `translateY(${scrollY * 0.2}px)`;
      });
    </script>
  </body>
</html>
